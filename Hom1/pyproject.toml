[project]
name = "hom1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Grzmro", email = "grzegorzmroz555@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clean-text>=0.7.1",
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "scikit-learn==1.7.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true

